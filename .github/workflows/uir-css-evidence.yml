name: UIR CSS screenshot evidence

on:
  push:
    branches:
      - uir/common-css-foundation
    paths:
      - .github/workflows/uir-css-evidence.yml
      - docs/qa/evidence/uir-css-foundation/**

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: uir-css-foundation-screenshots
          path: docs/qa/evidence/uir-css-foundation/*.png
          if-no-files-found: error
