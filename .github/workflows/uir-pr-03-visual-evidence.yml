name: UIR PR 03 visual evidence

on:
  pull_request:
    paths:
      - '.github/workflows/uir-pr-03-visual-evidence.yml'
      - 'src/components/blueprint/**'
      - 'src/components/conversation/**'
      - 'src/components/layout/BlueprintShell.tsx'
      - 'src/pages/ProjectPage.tsx'
      - 'src/styles/app-shell.css'
      - 'src/styles/workspace-shell.css'
      - 'src/styles/question-card.css'
      - 'src/styles/project-composer.css'
      - 'src/features/conversation/questionEngine.js'
      - 'tests/e2e/con-pr-05-conversation-flow.spec.ts'
      - 'tests/e2e/doc-pr-01-requirements-generation.spec.ts'
      - 'tests/e2e/doc-pr-02-prd-readiness.spec.ts'
      - 'tests/e2e/uir-pr-04-proposal-review.spec.ts'
      - 'docs/blueprint-design/**'
      - 'docs/tasks/CON-PR-05/**'
      - 'docs/delivery/evidence/CON-PR-05/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-conversation-evidence:
    name: Capture conversation UI evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture current conversation, Requirements, PRD, and proposal-review flows
        id: visual-test
        continue-on-error: true
        run: ./node_modules/.bin/playwright test tests/e2e/con-pr-05-conversation-flow.spec.ts tests/e2e/doc-pr-01-requirements-generation.spec.ts tests/e2e/doc-pr-02-prd-readiness.spec.ts tests/e2e/uir-pr-04-proposal-review.spec.ts --project=desktop-chromium --project=mobile-chromium --workers=1 --reporter=line

      - name: Upload current conversation and document-flow evidence
        id: upload-evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: con-pr-05-conversation-prd-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: .pr-artifacts/**
          if-no-files-found: error
          retention-days: 14

      - name: Publish evidence link and gate result
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.upload-evidence.outputs.artifact-url }}
          VISUAL_OUTCOME: ${{ steps.visual-test.outcome }}
        run: |
          printf '## Current conversation and document-flow evidence\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'Playwright screenshots at 1440x900 and 390x844 for the free conversation, contextual choices/recommendations, Requirements, PRD, and proposal review: [%s](%s)\n\n' "$ARTIFACT_URL" "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          printf 'Current user-flow browser outcome: `%s`. Matched source/render geometry and final visual review remain recorded in the CON-PR-05 evidence index.\n' "$VISUAL_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          if [ "$VISUAL_OUTCOME" != "success" ]; then exit 1; fi
